[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-congress"
version = "0.1.0"
description = "Autonomous LLM multi-agent system with weighted ensemble decision-making"
requires-python = ">=3.10"

[project.optional-dependencies]
# Heavy ML extras — install only if you need local embeddings / voice transcription.
# Everything degrades gracefully without them (lexical fallbacks, 501 endpoints).
full = [
    "sentence-transformers==3.1.1",
    "transformers==4.45.2",
    "faster-whisper==1.0.3",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services (Oracle, Ollama)",
    "unit: marks pure unit tests",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
